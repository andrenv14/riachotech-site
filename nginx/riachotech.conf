server {
    server_name riachotech.com.br www.riachotech.com.br;
    root /var/www/riachotech;
    index index.html;
    location ~ /\.(?!well-known/) { return 404; }
    # O repo É o diretório servido, então todo arquivo versionado fica
    # buscável por HTTP. Nada aqui é segredo — é higiene, mesmo motivo do
    # README.md e do nginx/. docs/, build/ e package*.json entraram com a
    # fatia S3 (build de CSS do Tailwind); node_modules é gitignored e nunca
    # chega aqui pelo git pull. Ver docs/s3-redesign.md.
    location ~ ^/(README\.md|nginx/|docs/|build/|package(-lock)?\.json) { return 404; }

    # O 404 padrão do Nginx é uma página branca com "404 Not Found" e a versão
    # do servidor: nomeia o problema em jargão, não oferece saída nenhuma e
    # ainda diz qual Nginx está rodando aqui. O /404.html é da marca e leva de
    # volta pro início ou pro WhatsApp. Ver docs/plans/2026-09-renovacao.md.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Compressão e cache dos estáticos. O `gzip on` é global no nginx.conf, mas
    # `gzip_types` está comentado lá — sem esta linha, css e js vão sem
    # compressão (medido: 37 KiB a mais no Lighthouse).
    gzip_types text/css application/javascript image/svg+xml;
    gzip_vary on;

    # ORDEM IMPORTA: estes dois `location ~*` vêm depois dos `location ~` de
    # bloqueio acima e ANTES do `location /`.
    # TTL curto no css/js de propósito: `index.html` referencia `site.css` e
    # `site.js` SEM versão na URL, então cache longo entregaria folha velha
    # depois de um `git pull`. `must-revalidate` faz o navegador conferir.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    # Imagem tem nome estável e conteúdo que só muda em deploy de design.
    location ~* \.(png|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/riachotech.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/riachotech.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.riachotech.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = riachotech.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name riachotech.com.br www.riachotech.com.br;
    return 404; # managed by Certbot




}