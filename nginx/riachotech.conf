server {
    server_name riachotech.com.br www.riachotech.com.br;
    root /var/www/riachotech;
    index index.html;
    location ~ /\.(?!well-known/) { return 404; }
    # O repo É o diretório servido, então todo arquivo versionado fica
    # buscável por HTTP. Nada aqui é segredo — é higiene, mesmo motivo do
    # README.md e do nginx/. docs/, build/ e package*.json entraram com a
    # fatia S3 (build de CSS do Tailwind); node_modules é gitignored e nunca
    # chega aqui pelo git pull. Ver docs/s3-redesign.md.
    location ~ ^/(README\.md|nginx/|docs/|build/|package(-lock)?\.json) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/riachotech.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/riachotech.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.riachotech.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = riachotech.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name riachotech.com.br www.riachotech.com.br;
    return 404; # managed by Certbot




}